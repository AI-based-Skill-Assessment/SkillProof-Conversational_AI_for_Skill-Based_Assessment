# Runs on every push and pull request: backend tests + frontend build.
# A red X on a commit means something is broken; click it to see which step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # pyzbar needs the zbar system library at import time
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      # The tests need no database, Redis or AI models. Skip the heavy optional
      # packages (DeepFace/TensorFlow, MediaPipe, Playwright, audio CLI tools):
      # the app imports them lazily and they add many minutes to every run.
      - name: Install Python dependencies
        run: |
          grep -viE '^(deepface|tf-keras|mediapipe|playwright|sounddevice|pyttsx3|scipy)\b' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
